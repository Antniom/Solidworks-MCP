[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solidworks-mcp"
dynamic = ["version"]
description = "Model Context Protocol (MCP) server for Dassault Systèmes SolidWorks: part modeling, assemblies, drawings, FEA, diagnostics and an A2UI interactive studio."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "António Coelho", email = "antoniocoelho2005@gmail.com" }
]
maintainers = [
    { name = "António Coelho", email = "antoniocoelho2005@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "solidworks",
    "mcp",
    "cad",
    "automation",
    "fea",
    "model-context-protocol",
    "llm",
    "engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=2.0.0",
    "pywin32>=306; sys_platform == 'win32'",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
]

[project.scripts]
solidworks-mcp = "solidworks_mcp.server:run"
solidworks-mcp-install = "solidworks_mcp.install:main"

[project.urls]
Homepage = "https://github.com/Antniom/Solidworks-MCP"
Repository = "https://github.com/Antniom/Solidworks-MCP.git"
Issues = "https://github.com/Antniom/Solidworks-MCP/issues"

[tool.hatch.version]
path = "solidworks_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["solidworks_mcp"]
exclude = ["solidworks_mcp/ui/host", "**/.bundle_cache", "*.log"]

# Skills, agent rules and the Antigravity plugin template have one home at the
# repo root; the wheel carries copies so `solidworks-mcp-install` can stage them.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "solidworks_mcp/_bundle/skills"
"rules" = "solidworks_mcp/_bundle/rules"
"plugins/solidworks" = "solidworks_mcp/_bundle/plugin"

[tool.hatch.build.targets.sdist]
include = [
    "/solidworks_mcp",
    "/skills",
    "/rules",
    "/plugins",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

# The server only runs on Windows; resolving for that platform alone keeps uv.lock small.
[tool.uv]
environments = ["sys_platform == 'win32'"]
