[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "solidworks-mcp"
version = "4.0.0"
description = "Production-grade Model Context Protocol (MCP) server for Dassault Systèmes SolidWorks with 66 verified CAD, assembly, drawing, FEA, and diagnostic tools."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "António Coelho", email = "antoniocoelho2005@gmail.com" }
]
maintainers = [
    { name = "António Coelho", email = "antoniocoelho2005@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "solidworks",
    "mcp",
    "cad",
    "automation",
    "fea",
    "model-context-protocol",
    "llm",
    "engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.0.0",
    "pywin32>=306",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
]

[project.scripts]
solidworks-mcp = "solidworks_mcp.server:main"
solidworks-mcp-install = "solidworks_mcp.install:main"

[project.urls]
Homepage = "https://github.com/Antniom/Solidworks-MCP"
Repository = "https://github.com/Antniom/Solidworks-MCP.git"
Issues = "https://github.com/Antniom/Solidworks-MCP/issues"

[tool.hatch.build.targets.wheel]
packages = ["solidworks_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/solidworks_mcp",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
