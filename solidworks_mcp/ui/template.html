<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolidWorks AI Studio</title>
  <script>
    // Detect environment: iframe embed vs standalone browser window/tab
    try {
      if (window.self === window.top) {
        document.documentElement.classList.add('standalone');
      } else {
        document.documentElement.classList.add('embedded');
      }
    } catch (e) {
      document.documentElement.classList.add('embedded');
    }
  </script>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --card-muted: #1e293b;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #0284c7;
      --danger: #ef4444;
      --success: #10b981;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --card-muted: #f1f5f9;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --accent: #38bdf8;
        --danger: #dc2626;
        --success: #059669;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #020617; /* Dark slate-950: completely eliminates white canvas void in full window */
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* Embedded Mode (In-Chat Iframe) */
    html.embedded, html.embedded body {
      max-height: 476px;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.embedded #app {
      width: 100%;
      height: 100%;
      max-height: 470px;
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    html.embedded #col-viewport {
      width: 250px;
    }

    /* Standalone Mode (Full Window / Browser Tab) */
    html.standalone, html.standalone body {
      height: 100vh !important;
      max-height: 100vh !important;
      padding: 0 !important;
      display: flex;
      flex-direction: column;
      background-color: #020617 !important;
    }
    html.standalone #app {
      width: 100vw !important;
      height: 100vh !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }
    html.standalone #col-viewport {
      width: 52% !important;
      min-width: 440px !important;
    }
    html.standalone #btn-popout {
      display: none !important;
    }
    html.standalone #model-title {
      max-width: 380px;
      font-size: 0.875rem;
    }
    html.standalone #viewport-stage {
      margin: 0;
      height: 100%;
    }
    .cad-grid {
      background-image: 
        radial-gradient(rgba(56, 189, 248, 0.12) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 16px 16px, 32px 32px, 32px 32px;
    }
    input[type=range] {
      -webkit-appearance: none;
      height: 5px;
      border-radius: 9999px;
      background: #1e293b;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
      border: 2px solid #ffffff;
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .revert-error {
      border-color: var(--danger) !important;
      animation: pulse-red 1.2s ease-in-out infinite;
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
    }
    /* Sleek custom scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body style="background-color: #020617;">
  <div id="app" class="w-full h-full bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden flex flex-col transition-all">
    
    <!-- Top Header (Compact 40px) -->
    <header class="h-10 px-3 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 flex items-center justify-between gap-2 shrink-0">
      <div class="flex items-center gap-2 min-w-0">
        <!-- SolidWorks Emblem -->
        <div class="w-6 h-6 rounded bg-gradient-to-br from-rose-500 to-red-600 text-white flex items-center justify-center font-black text-[10px] shadow-sm shadow-rose-950/50 ring-1 ring-white/10 shrink-0">
          SW
        </div>
        <div class="flex items-center gap-1.5 min-w-0">
          <h1 id="model-title" class="text-xs font-bold text-white tracking-tight truncate max-w-[140px] sm:max-w-[200px]" title="SolidWorks Active Part">SolidWorks Part</h1>
          <span id="unit-badge" class="px-1 py-0.2 rounded text-[9px] font-mono font-semibold bg-slate-800 text-cyan-400 border border-slate-700 uppercase">MM</span>
          <button id="connection-badge" type="button" title="Fast-Bridge Status - Click to re-sync" class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-950/60 border border-emerald-500/40 text-emerald-400 cursor-pointer hover:brightness-110 transition">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="connection-text">Live</span>
          </button>
        </div>
      </div>

      <!-- Center View Mode Tabs -->
      <div class="flex items-center p-0.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] shrink-0">
        <button id="btn-mode-split" class="mode-btn px-2 py-0.5 rounded font-medium transition cursor-pointer bg-cyan-600 text-white shadow-xs" title="Side-by-side Viewport and Sliders">Split</button>
        <button id="btn-mode-sliders" class="mode-btn px-2 py-0.5 rounded font-medium transition cursor-pointer text-slate-400 hover:text-slate-200" title="Maximize Sliders">Sliders</button>
        <button id="btn-mode-3d" class="mode-btn px-2 py-0.5 rounded font-medium transition cursor-pointer text-slate-400 hover:text-slate-200" title="Maximize 3D Viewport">3D View</button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btn-refresh" title="Reload dimensions from SolidWorks" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        </button>
        <button id="btn-popout" title="Open Studio in new full window/tab" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
        </button>
        <button id="btn-prompt-agent" title="Send modifications to AI chat" class="px-2.5 py-1 rounded-lg bg-gradient-to-r from-cyan-500 to-sky-600 hover:from-cyan-400 hover:to-sky-500 text-white transition text-[11px] font-semibold flex items-center gap-1 shadow-sm shadow-sky-950/40 cursor-pointer">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          <span class="hidden sm:inline">Prompt</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace (Flex Row, Side-by-Side: Viewport Left + Sliders Right) -->
    <div id="workspace-container" class="flex-1 min-h-0 flex flex-row overflow-hidden border-b border-slate-800">
      
      <!-- Left: 3D Viewport Column (w-[240px] to w-[280px]) -->
      <div id="col-viewport" class="w-[230px] sm:w-[260px] shrink-0 bg-slate-950/80 p-2.5 flex flex-col justify-between border-r border-slate-800 overflow-hidden transition-all duration-200">
        
        <!-- Orientation Toolbar -->
        <div class="flex items-center justify-between mb-1.5 shrink-0">
          <div class="flex items-center p-0.5 rounded bg-slate-900 border border-slate-800 text-[10px]">
            <button data-view="*Isometric" class="view-btn px-2 py-0.5 rounded font-medium transition cursor-pointer bg-cyan-600 text-white shadow-xs">Iso</button>
            <button data-view="*Front" class="view-btn px-2 py-0.5 rounded font-medium transition cursor-pointer text-slate-400 hover:text-slate-200">Front</button>
            <button data-view="*Top" class="view-btn px-2 py-0.5 rounded font-medium transition cursor-pointer text-slate-400 hover:text-slate-200">Top</button>
            <button data-view="*Right" class="view-btn px-2 py-0.5 rounded font-medium transition cursor-pointer text-slate-400 hover:text-slate-200">Right</button>
          </div>
          <span id="render-latency" class="text-[9px] font-mono text-slate-500">Live</span>
        </div>

        <!-- Viewport Render Area -->
        <div id="viewport-stage" class="relative flex-1 min-h-0 w-full rounded-lg overflow-hidden bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 border border-slate-800 flex items-center justify-center select-none shadow-inner my-auto">
          <!-- CAD Grid Background -->
          <div class="absolute inset-0 cad-grid opacity-20 pointer-events-none"></div>

          <!-- Fallback Stage -->
          <div id="viewport-fallback" class="absolute inset-0 flex flex-col items-center justify-center p-3 text-center transition-opacity duration-300">
            <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mb-2 shadow-sm animate-pulse">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
            <p id="viewport-fallback-status" class="text-[11px] font-semibold text-slate-300 uppercase tracking-wider">SolidWorks Viewport</p>
            <p class="text-[10px] text-slate-500 mt-0.5">Capturing live 3D preview...</p>
            <button id="btn-force-capture" class="mt-2 px-2.5 py-0.5 rounded text-[10px] font-medium bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 transition flex items-center gap-1 cursor-pointer">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
              <span>Capture</span>
            </button>
          </div>

          <!-- Active Model Render -->
          <img id="viewport-preview"
               src=""
               alt=""
               style="display: none;"
               class="relative z-10 max-h-full max-w-full object-contain filter drop-shadow-[0_8px_16px_rgba(0,0,0,0.6)] transition-opacity duration-200">

          <!-- Coordinate Axes Triad (Bottom-Left) -->
          <div class="absolute bottom-1.5 left-1.5 z-20 flex items-center gap-1 px-1.5 py-0.2 rounded bg-slate-900/85 backdrop-blur-md border border-slate-800 text-[9px] font-mono shadow-xs">
            <span class="text-rose-400 font-bold">X</span>
            <span class="text-emerald-400 font-bold">Y</span>
            <span class="text-sky-400 font-bold">Z</span>
            <span class="text-slate-600">|</span>
            <span id="active-view-badge" class="text-slate-300 uppercase">ISO</span>
          </div>

          <!-- Bounding Box Floating HUD (Bottom-Right) -->
          <div id="bbox-readout" class="absolute bottom-1.5 right-1.5 z-20 px-1.5 py-0.2 rounded bg-slate-900/85 backdrop-blur-md border border-slate-800 text-[9px] font-mono text-slate-300 flex items-center gap-1 shadow-xs">
            <svg class="w-2.5 h-2.5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            <span id="bbox-text">Bounds: --</span>
          </div>

          <!-- Rebuilding Progress Overlay -->
          <div id="rebuild-spinner" class="absolute inset-0 z-30 bg-slate-950/75 backdrop-blur-xs flex flex-col items-center justify-center gap-1.5 opacity-0 pointer-events-none transition-opacity duration-150">
            <div class="w-6 h-6 rounded-full border-2 border-cyan-400/20 border-t-cyan-400 animate-spin"></div>
            <span class="text-[10px] font-medium text-cyan-200 tracking-wider uppercase drop-shadow">Rebuilding...</span>
          </div>
        </div>

      </div>

      <!-- Right: Parametric Sliders Column -->
      <div id="col-sliders" class="flex-1 min-w-0 p-3 flex flex-col justify-between overflow-hidden bg-slate-900">
        <div class="flex-1 min-h-0 flex flex-col">
          <!-- Controls Header Bar -->
          <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800 shrink-0">
            <div class="flex items-center gap-1.5">
              <span class="text-[11px] font-bold text-white uppercase tracking-wider">Parameters</span>
              <span id="dims-count" class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-slate-800 text-slate-400 border border-slate-700">0</span>
            </div>
            <span id="modified-count-badge" class="text-[10px] font-mono text-cyan-400 font-medium">0 modified</span>
          </div>
          
          <!-- Scrollable Dimension List -->
          <div id="dimensions-container" class="flex-1 min-h-0 overflow-y-auto space-y-2.5 pr-1">
            <!-- Dynamically populated feature cards -->
          </div>
        </div>

        <!-- Toast Notification Bar (Compact) -->
        <div id="status-toast" class="mt-2 text-[11px] py-1 px-2.5 rounded border border-transparent flex items-center justify-between transition-all opacity-0 shrink-0">
          <span id="toast-message" class="truncate font-medium">Ready</span>
        </div>
      </div>

    </div>

    <!-- Quick Edit Action Bar (Footer 30px) -->
    <footer class="h-8 px-3 bg-slate-950/80 border-t border-slate-800 flex items-center justify-between text-[11px] text-slate-400 shrink-0">
      <div class="flex items-center gap-2">
        <label class="inline-flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" id="chk-live-sync" checked class="rounded border-slate-700 text-cyan-500 focus:ring-0 w-3 h-3 bg-slate-800">
          <span class="text-[10px] text-slate-300">Live Rebuild on Drag</span>
        </label>
      </div>
      <div class="flex items-center gap-2.5">
        <button id="btn-reset-all" class="text-[10px] text-slate-400 hover:text-rose-400 transition cursor-pointer">Reset All</button>
        <span class="text-slate-700">|</span>
        <span class="font-mono text-[10px] text-slate-500">SolidWorks AI Studio</span>
      </div>
    </footer>

  </div>

  <script>
    // Injected state payload
    const state = window.__SW_STATE__ || {
      bridgePort: 54321,
      modelTitle: "SolidWorks Model",
      units: "mm",
      initialImage: "",
      bbox: null,
      featureLabels: {},
      dimensionLabels: {},
      dimensions: [],
      revision: (window.__SW_STATE__ && window.__SW_STATE__.revision) || 1
    };

    // Tracking modified parameters
    const originalValues = new Map();
    const currentValues = new Map();
    let isUpdating = false;
    let pendingUpdate = null;
    let debounceTimer = null;
    let activeView = "*Isometric";
    let currentMode = "split"; // "split", "sliders", "3d"

    // Viewport image callbacks
    function onViewportImageLoaded(img) {
      if (img.src && !img.src.endsWith("#empty")) {
        img.style.display = "block";
        img.style.opacity = "1";
        const fallback = document.getElementById("viewport-fallback");
        if (fallback) fallback.style.opacity = "0";
      }
    }

    function onViewportImageError(img) {
      img.style.display = "none";
      const fallback = document.getElementById("viewport-fallback");
      if (fallback) {
        fallback.style.opacity = "1";
        const statusText = document.getElementById("viewport-fallback-status");
        if (statusText) statusText.innerText = "Viewport Stream Standby";
      }
    }

    // Initialize UI
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("model-title").innerText = state.modelTitle || "SolidWorks Model";
      document.getElementById("unit-badge").innerText = state.units || "mm";

      // Viewport image initialization
      const previewImg = document.getElementById("viewport-preview");
      if (state.initialImage && state.initialImage.startsWith("data:image")) {
        previewImg.src = state.initialImage;
        previewImg.onload = () => onViewportImageLoaded(previewImg);
      } else {
        requestCapture(activeView);
      }

      updateBboxReadout(state.bbox);

      // Populate dimensions
      renderDimensions(state.dimensions);

      // Bind view switcher
      document.querySelectorAll(".view-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".view-btn").forEach(b => {
            b.classList.remove("bg-cyan-600", "text-white", "shadow-xs");
            b.classList.add("text-slate-400");
          });
          btn.classList.add("bg-cyan-600", "text-white", "shadow-xs");
          btn.classList.remove("text-slate-400");
          activeView = btn.getAttribute("data-view");
          const viewLabel = activeView.replace("*", "").toUpperCase();
          document.getElementById("active-view-badge").innerText = viewLabel;
          requestCapture(activeView);
        });
      });

      // Bind Layout Mode Toggles
      document.getElementById("btn-mode-split").addEventListener("click", () => setLayoutMode("split"));
      document.getElementById("btn-mode-sliders").addEventListener("click", () => setLayoutMode("sliders"));
      document.getElementById("btn-mode-3d").addEventListener("click", () => setLayoutMode("3d"));

      // Bind popout / expand
      document.getElementById("btn-popout").addEventListener("click", openFullStudio);

      // Bind force capture button
      const forceBtn = document.getElementById("btn-force-capture");
      if (forceBtn) {
        forceBtn.addEventListener("click", () => requestCapture(activeView));
      }

      // Bind refresh
      document.getElementById("btn-refresh").addEventListener("click", () => {
        fetchDimensions();
        requestCapture(activeView);
      });

      // Bind prompt agent
      document.getElementById("btn-prompt-agent").addEventListener("click", emitPromptToAgent);

      // Bind reset all
      document.getElementById("btn-reset-all").addEventListener("click", resetAllDimensions);

      // Test bridge connectivity, start SSE real-time push, and heartbeat
      checkBridgeHealth();
      startEventStream();
      if (!healthInterval) {
        healthInterval = setInterval(checkBridgeHealth, 1500);
      }

      // Instant synchronization whenever window/tab regains focus, hovered, or clicked
      const triggerSync = () => checkBridgeHealth();
      window.addEventListener("focus", triggerSync);
      document.addEventListener("pointerenter", triggerSync);
      document.addEventListener("mouseenter", triggerSync);
      document.addEventListener("mousemove", triggerSync, { passive: true });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") triggerSync();
      });

      // Bind connection badge click to re-sync
      const connBadge = document.getElementById("connection-badge");
      if (connBadge) {
        connBadge.addEventListener("click", async () => {
          showToast("Checking Fast-Bridge connection...", "info");
          const ok = await checkBridgeHealth();
          if (ok) {
            showToast("Connected to Fast-Bridge!", "success");
            fetchDimensions();
            requestCapture(activeView);
          } else {
            const port = state.bridgePort || 54321;
            showToast(`Fast-Bridge offline on port ${port}`, "error");
          }
        });
      }
    });

    // Layout mode switcher
    function setLayoutMode(mode) {
      currentMode = mode;
      const colViewport = document.getElementById("col-viewport");
      const colSliders = document.getElementById("col-sliders");
      const btns = {
        split: document.getElementById("btn-mode-split"),
        sliders: document.getElementById("btn-mode-sliders"),
        "3d": document.getElementById("btn-mode-3d"),
      };

      Object.entries(btns).forEach(([k, btn]) => {
        if (k === mode) {
          btn.classList.add("bg-cyan-600", "text-white", "shadow-xs");
          btn.classList.remove("text-slate-400");
        } else {
          btn.classList.remove("bg-cyan-600", "text-white", "shadow-xs");
          btn.classList.add("text-slate-400");
        }
      });

      const isStandalone = document.documentElement.classList.contains("standalone");
      if (mode === "split") {
        colViewport.style.display = "flex";
        colViewport.style.width = isStandalone ? "52%" : "";
        colViewport.className = (isStandalone ? "shrink-0" : "w-[230px] sm:w-[260px] shrink-0") + " bg-slate-950/80 p-2.5 flex flex-col justify-between border-r border-slate-800 overflow-hidden transition-all duration-200";
        colSliders.style.display = "flex";
      } else if (mode === "sliders") {
        colViewport.style.display = "none";
        colSliders.style.display = "flex";
      } else if (mode === "3d") {
        colViewport.style.display = "flex";
        colViewport.style.width = "100%";
        colViewport.className = "flex-1 w-full bg-slate-950/80 p-3 flex flex-col justify-between border-r-0 overflow-hidden transition-all duration-200";
        colSliders.style.display = "none";
      }
    }

    // Open full studio in external window/tab
    function openFullStudio() {
      const port = state.bridgePort || 54321;
      const url = `http://127.0.0.1:${port}/api/app.html`;
      window.open(url, "_blank");
    }

    // Heartbeat & status tracking
    let healthInterval = null;
    let lastKnownRevision = null;

    async function checkBridgeHealth() {
      const port = state.bridgePort || 54321;
      const badge = document.getElementById("connection-badge");
      const text = document.getElementById("connection-text");
      if (!badge || !text) return false;
      try {
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), 1200);
        const resp = await fetch(`http://127.0.0.1:${port}/health`, { method: "GET", signal: controller.signal });
        clearTimeout(tid);
        if (resp.ok) {
          const data = await resp.json().catch(() => ({}));
          badge.className = "inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-950/60 border border-emerald-500/40 text-emerald-400 cursor-pointer hover:brightness-110 transition";
          badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span><span>● :${port}</span>`;
          badge.title = `Fast-Bridge Connected (${data.active_doc || 'Ready'}) - Click to re-sync`;

          // Instant bidirectional sync whenever revision changes
          if (data.revision !== undefined) {
            if (lastKnownRevision === null) {
              lastKnownRevision = data.revision;
              state.revision = data.revision;
            } else if (data.revision !== lastKnownRevision) {
              lastKnownRevision = data.revision;
              state.revision = data.revision;
              if (!isUpdating && !pendingUpdate) {
                syncFromBridge();
              }
            }
          }
          return true;
        }
      } catch (e) {}
      badge.className = "inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-rose-950/60 border border-rose-500/40 text-rose-400 cursor-pointer hover:brightness-110 transition";
      badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span><span>○ Offline (:${port})</span>`;
      badge.title = `Fast-Bridge Offline on port ${port} - Click to retry`;
      return false;
    }



    // Server-Sent Events (SSE) push stream for sub-millisecond bidirectional sync
    let sseSource = null;

    function startEventStream() {
      const port = state.bridgePort || 54321;
      if (sseSource) {
        try { sseSource.close(); } catch (e) {}
        sseSource = null;
      }

      try {
        sseSource = new EventSource(`http://127.0.0.1:${port}/api/events`);
        sseSource.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.type === "init") {
              if (msg.revision) {
                lastKnownRevision = msg.revision;
                state.revision = msg.revision;
              }
            } else if (msg.type === "update") {
              if (msg.revision) {
                lastKnownRevision = msg.revision;
                state.revision = msg.revision;
              }
              if (isUpdating || pendingUpdate) return;

              if (msg.image_base64) {
                const previewImg = document.getElementById("viewport-preview");
                previewImg.src = msg.image_base64;
                onViewportImageLoaded(previewImg);
              }
              if (msg.bbox) updateBboxReadout(msg.bbox);
              if (msg.name && msg.value !== undefined) {
                updateSingleDimension(msg.name, msg.value);
              }
            } else if (msg.type === "rename") {
              if (msg.revision) {
                lastKnownRevision = msg.revision;
                state.revision = msg.revision;
              }
              fetchDimensions();
            }
          } catch (e) {}
        };
      } catch (e) {}
    }

    function getStandardDimensionBounds(val, isAngle) {
      if (isAngle) {
        return { min: 1.0, max: val > 180 ? 360.0 : 180.0, step: 1.0 };
      }
      const v = Math.max(0.1, Math.abs(val));
      if (v <= 15.0) return { min: 0.5, max: 30.0, step: 0.5 };
      if (v <= 30.0) return { min: 1.0, max: 60.0, step: 0.5 };
      if (v <= 60.0) return { min: 2.0, max: 120.0, step: 1.0 };
      if (v <= 120.0) return { min: 5.0, max: 250.0, step: 1.0 };
      if (v <= 250.0) return { min: 10.0, max: 500.0, step: 2.0 };
      if (v <= 500.0) return { min: 20.0, max: 1000.0, step: 5.0 };
      const maxVal = Math.ceil(v * 2.0 / 50.0) * 50.0;
      return { min: 50.0, max: maxVal, step: 5.0 };
    }

    function updateSingleDimension(name, val) {
      const dimObj = state.dimensions.find(d => 
        d.full_name === name || 
        name.startsWith(d.full_name) || 
        d.full_name.startsWith(name) ||
        (d.owner_feature && name.includes(d.owner_feature) && name.includes(d.name))
      );

      if (dimObj) {
        dimObj.value = val;
        currentValues.set(dimObj.full_name, val);

        const isAngle = dimObj.is_angle || dimObj.units === "deg";
        const bounds = getStandardDimensionBounds(val, isAngle);

        const slider = document.getElementById(`slider-${sanitizeId(dimObj.full_name)}`);
        const numInput = document.getElementById(`num-${sanitizeId(dimObj.full_name)}`);

        if (slider) {
          slider.min = bounds.min;
          slider.max = bounds.max;
          slider.step = bounds.step;
          if (document.activeElement !== slider) slider.value = val;
        }
        if (numInput) {
          numInput.min = bounds.min;
          numInput.max = bounds.max;
          numInput.step = bounds.step;
          if (document.activeElement !== numInput) numInput.value = val;
        }

        const orig = originalValues.get(dimObj.full_name);
        const dot = document.getElementById(`mod-dot-${sanitizeId(dimObj.full_name)}`);
        if (dot) {
          const isMod = orig !== undefined && Math.abs(orig - val) > 0.001;
          dot.classList.toggle("hidden", !isMod);
        }
        updateModifiedBadge();
      } else {
        syncFromBridge();
      }
    }

    // Synchronize state from Fast-Bridge when modified by an external tab or chat
    async function syncFromBridge() {
      if (isUpdating || pendingUpdate) return;
      const port = state.bridgePort || 54321;
      try {
        const resp = await fetch(`http://127.0.0.1:${port}/api/sync`, { method: "GET" });
        if (!resp.ok) return;
        const data = await resp.json();
        if (data.success) {
          state.revision = data.revision;

          // 1. Update preview image
          if (data.image_base64) {
            const previewImg = document.getElementById("viewport-preview");
            previewImg.src = data.image_base64;
            onViewportImageLoaded(previewImg);
          }

          // 2. Update bounding box
          if (data.bbox) updateBboxReadout(data.bbox);

          // 3. Update dimension values seamlessly without tearing down DOM
          if (data.dimensions && data.dimensions.length > 0) {
            updateDimensionsSilently(data.dimensions);
          }
        }
      } catch (e) {
        console.debug("Sync failed:", e);
      }
    }

    function updateDimensionsSilently(newDims) {
      newDims.forEach(newDim => {
        const fullName = newDim.full_name || `${newDim.name}@${newDim.owner_feature}`;
        updateSingleDimension(fullName, newDim.value);
      });
    }

    // Render grouped dimension sliders with semantic labeling and inline feature renaming
    function renderDimensions(dims) {
      const container = document.getElementById("dimensions-container");
      container.innerHTML = "";

      if (!dims || dims.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-500 text-xs">
            <svg class="w-8 h-8 mx-auto mb-2 opacity-40 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            No driving dimensions detected in active model.
          </div>
        `;
        document.getElementById("dims-count").innerText = "0";
        return;
      }

      document.getElementById("dims-count").innerText = dims.length;

      // Group by owner feature
      const groups = {};
      dims.forEach(dim => {
        const owner = dim.owner_feature || "Model Dimensions";
        if (!groups[owner]) groups[owner] = [];
        groups[owner].push(dim);
        originalValues.set(dim.full_name, dim.value);
        currentValues.set(dim.full_name, dim.value);
      });

      Object.entries(groups).forEach(([featName, featDims]) => {
        const groupEl = document.createElement("div");
        groupEl.className = "rounded-lg border border-slate-800 bg-slate-950/50 overflow-hidden";
        groupEl.id = `group-${sanitizeId(featName)}`;

        // Friendly label resolution
        const friendlyFeatLabel = (state.featureLabels && state.featureLabels[featName]) || featName;
        const hasCustomFeatLabel = friendlyFeatLabel !== featName;

        // Group Header with Inline Feature Renaming ✏️
        const headerEl = document.createElement("div");
        headerEl.className = "px-2.5 py-1.5 bg-slate-950/80 border-b border-slate-800/80 flex items-center justify-between text-xs font-semibold text-slate-300";
        headerEl.innerHTML = `
          <div class="flex items-center gap-1.5 min-w-0 flex-1">
            <svg class="w-3.5 h-3.5 text-cyan-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <div id="feat-title-wrap-${sanitizeId(featName)}" class="flex items-center gap-1 min-w-0">
              <span id="feat-display-${sanitizeId(featName)}" class="font-bold text-white truncate max-w-[150px] cursor-pointer hover:text-cyan-300" title="Click to rename feature in SolidWorks">${friendlyFeatLabel}</span>
              ${hasCustomFeatLabel ? `<span class="text-[9px] font-mono text-slate-500 truncate max-w-[80px]">(${featName})</span>` : ''}
              <button class="rename-feat-btn text-slate-500 hover:text-cyan-400 transition p-0.5" title="Rename feature in SolidWorks" data-feat="${featName}">
                <svg class="w-2.5 h-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
              </button>
            </div>
            <!-- Inline Rename Input (Hidden by default) -->
            <div id="feat-rename-box-${sanitizeId(featName)}" class="hidden flex items-center gap-1">
              <input type="text" id="feat-input-${sanitizeId(featName)}" value="${featName}" class="px-1.5 py-0.2 text-[11px] bg-slate-800 border border-cyan-500 rounded text-white font-medium focus:outline-none w-28">
              <button class="save-rename-btn p-0.5 rounded bg-cyan-600 hover:bg-cyan-500 text-white" data-feat="${featName}" title="Save to SolidWorks">✓</button>
              <button class="cancel-rename-btn p-0.5 text-slate-400 hover:text-white" data-feat="${featName}" title="Cancel">✕</button>
            </div>
          </div>
          <span class="text-[9px] font-mono text-slate-500 shrink-0">${featDims.length} dim</span>
        `;
        groupEl.appendChild(headerEl);

        // Bind Rename Handlers
        const renameBtn = headerEl.querySelector(".rename-feat-btn");
        const titleSpan = headerEl.querySelector(`#feat-display-${sanitizeId(featName)}`);
        const titleWrap = headerEl.querySelector(`#feat-title-wrap-${sanitizeId(featName)}`);
        const renameBox = headerEl.querySelector(`#feat-rename-box-${sanitizeId(featName)}`);
        const renameInput = headerEl.querySelector(`#feat-input-${sanitizeId(featName)}`);
        const saveBtn = headerEl.querySelector(".save-rename-btn");
        const cancelBtn = headerEl.querySelector(".cancel-rename-btn");

        const startRename = () => {
          titleWrap.classList.add("hidden");
          renameBox.classList.remove("hidden");
          renameInput.focus();
          renameInput.select();
        };

        const cancelRename = () => {
          renameBox.classList.add("hidden");
          titleWrap.classList.remove("hidden");
        };

        const commitRename = async () => {
          const newName = renameInput.value.trim();
          if (!newName || newName === featName) {
            cancelRename();
            return;
          }
          await renameFeatureInSolidWorks(featName, newName);
        };

        renameBtn.addEventListener("click", startRename);
        titleSpan.addEventListener("click", startRename);
        cancelBtn.addEventListener("click", cancelRename);
        saveBtn.addEventListener("click", commitRename);
        renameInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") commitRename();
          if (e.key === "Escape") cancelRename();
        });

        // Group Body
        const bodyEl = document.createElement("div");
        bodyEl.className = "p-2 space-y-2";

        featDims.forEach(dim => {
          const rowEl = document.createElement("div");
          rowEl.className = "space-y-1";
          rowEl.id = `dim-row-${sanitizeId(dim.full_name)}`;

          const isAngle = dim.is_angle || dim.units === "deg";
          const unitLabel = dim.units || (isAngle ? "deg" : "mm");
          const bounds = getStandardDimensionBounds(dim.value, isAngle);
          const minVal = (dim.min !== undefined && dim.min !== null && !isNaN(dim.min)) ? dim.min : bounds.min;
          const maxVal = (dim.max !== undefined && dim.max !== null && !isNaN(dim.max)) ? dim.max : bounds.max;
          const stepVal = (dim.step !== undefined && dim.step !== null && !isNaN(dim.step)) ? dim.step : bounds.step;

          // Friendly label & semantic hint resolution
          let customDimLabel = null;
          if (state.dimensionLabels) {
            if (state.dimensionLabels[dim.full_name]) {
              customDimLabel = state.dimensionLabels[dim.full_name];
            } else {
              const shortName = `${dim.name}@${dim.owner_feature}`;
              if (state.dimensionLabels[shortName]) {
                customDimLabel = state.dimensionLabels[shortName];
              } else if (state.dimensionLabels[dim.owner_feature]) {
                customDimLabel = state.dimensionLabels[dim.owner_feature];
              } else {
                for (const [k, v] of Object.entries(state.dimensionLabels)) {
                  if (dim.full_name && (dim.full_name.includes(k) || k.includes(shortName))) {
                    customDimLabel = v;
                    break;
                  }
                }
              }
            }
          }
          const featNameLower = (dim.owner_feature || "").toLowerCase();
          const fallbackHint = featNameLower.includes("head") ? "Head Thickness" :
                               featNameLower.includes("shaft") ? "Shaft Length" :
                               (dim.semantic_hint && dim.semantic_hint !== "Feature Dimension") ? dim.semantic_hint :
                               (dim.name === "D1" ? "Length / Depth" : dim.name);
          const semanticHint = customDimLabel || fallbackHint;
          const showSubName = customDimLabel || (dim.semantic_hint && dim.name !== dim.semantic_hint);

          rowEl.innerHTML = `
            <div class="flex items-center justify-between text-[11px]">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="font-medium text-slate-200 truncate max-w-[120px] sm:max-w-[160px]" title="${dim.full_name}">${semanticHint}</span>
                <span class="text-[9px] font-mono text-slate-500">${dim.name}</span>
                <span id="mod-dot-${sanitizeId(dim.full_name)}" class="w-1.5 h-1.5 rounded-full bg-cyan-400 hidden"></span>
              </div>
              <div class="flex items-center gap-1">
                <input type="number" 
                       id="num-${sanitizeId(dim.full_name)}" 
                       value="${dim.value}" 
                       step="${stepVal}" 
                       min="${minVal}" 
                       max="${maxVal}" 
                       class="w-14 px-1 py-0.2 text-right font-mono text-[11px] bg-slate-800 border border-slate-700 rounded text-cyan-300 focus:outline-none focus:border-cyan-400">
                <span class="text-[10px] font-mono text-slate-400">${unitLabel}</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button title="Decrease" class="step-btn px-1 py-0.2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-[10px] font-mono border border-slate-700" data-delta="-${stepVal * 5}">-</button>
              <input type="range" 
                     id="slider-${sanitizeId(dim.full_name)}" 
                     value="${dim.value}" 
                     min="${minVal}" 
                     max="${maxVal}" 
                     step="${stepVal}" 
                     class="flex-1 accent-cyan-400 cursor-pointer">
              <button title="Increase" class="step-btn px-1 py-0.2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-[10px] font-mono border border-slate-700" data-delta="+${stepVal * 5}">+</button>
            </div>
          `;

          // Event Listeners
          const slider = rowEl.querySelector(`#slider-${sanitizeId(dim.full_name)}`);
          const numInput = rowEl.querySelector(`#num-${sanitizeId(dim.full_name)}`);

          slider.addEventListener("input", (e) => {
            const val = parseFloat(e.target.value);
            numInput.value = val;
            onDimensionInput(dim.full_name, val, unitLabel);
          });

          numInput.addEventListener("change", (e) => {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
              const bounds = getStandardDimensionBounds(val, isAngle);
              slider.min = bounds.min;
              slider.max = bounds.max;
              slider.step = bounds.step;
              numInput.min = bounds.min;
              numInput.max = bounds.max;
              numInput.step = bounds.step;
              slider.value = val;
              onDimensionInput(dim.full_name, val, unitLabel);
            }
          });

          rowEl.querySelectorAll(".step-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              const delta = parseFloat(btn.getAttribute("data-delta"));
              const cur = parseFloat(slider.value);
              const minB = parseFloat(slider.min);
              const maxB = parseFloat(slider.max);
              const next = Math.max(minB, Math.min(maxB, parseFloat((cur + delta).toFixed(2))));
              slider.value = next;
              numInput.value = next;
              onDimensionInput(dim.full_name, next, unitLabel);
            });
          });

          bodyEl.appendChild(rowEl);
        });

        groupEl.appendChild(bodyEl);
        container.appendChild(groupEl);
      });
    }

    // Rename feature live via Fast-Bridge
    async function renameFeatureInSolidWorks(oldName, newName) {
      showToast(`Renaming '${oldName}' to '${newName}'...`, "info");
      const port = state.bridgePort || 54321;
      try {
        const resp = await fetch(`http://127.0.0.1:${port}/api/rename_feature`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ feature_name: oldName, new_name: newName })
        });
        const res = await resp.json();
        if (resp.ok && res.success) {
          showToast(`Renamed '${oldName}' -> '${newName}'`, "success");
          // Update local state
          state.dimensions.forEach(d => {
            if (d.owner_feature === oldName) {
              d.owner_feature = newName;
              d.full_name = d.full_name.replace(`@${oldName}@`, `@${newName}@`);
            }
          });
          if (state.featureLabels) {
            state.featureLabels[newName] = newName;
            delete state.featureLabels[oldName];
          }
          renderDimensions(state.dimensions);
          return;
        } else {
          showToast(res.message || "Failed to rename feature", "error");
        }
      } catch (e) {
        showToast(`Error renaming feature: ${e.message}`, "error");
      }
    }

    // Debounced dimension change handler
    function onDimensionInput(dimName, value, units) {
      currentValues.set(dimName, value);
      updateModifiedIndicators();

      const liveSync = document.getElementById("chk-live-sync").checked;
      if (!liveSync) return;

      pendingUpdate = { name: dimName, value: value, units: units, view_name: activeView };

      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        executePendingUpdate();
      }, 75);
    }

    // Send dimension update to Fast-Bridge
    async function executePendingUpdate() {
      if (!pendingUpdate || isUpdating) return;
      const update = pendingUpdate;
      pendingUpdate = null;
      isUpdating = true;

      setRebuildingUI(true);
      const port = state.bridgePort || 54321;
      const startTime = performance.now();

      try {
        const resp = await fetch(`http://127.0.0.1:${port}/api/set_dimension`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(update)
        });

        const elapsed = Math.round(performance.now() - startTime);
        document.getElementById("render-latency").innerText = `${elapsed}ms`;

        const data = await resp.json();

        if (resp.ok && data.success) {
          if (data.revision) state.revision = data.revision;
          if (data.image_base64) {
            const previewImg = document.getElementById("viewport-preview");
            previewImg.src = data.image_base64;
            onViewportImageLoaded(previewImg);
          }
          if (data.bbox) updateBboxReadout(data.bbox);
          showToast(`Rebuilt: ${update.name.split('@')[0]} -> ${update.value} ${update.units}`, "success");
          clearRowError(update.name);
        } else {
          highlightRowError(update.name);
          showToast(data.error || "Rebuild failed - rolling back", "error");
          if (data.revert_value !== undefined && data.revert_value !== null) {
            revertLocalDimension(update.name, data.revert_value);
          }
        }
      } catch (e) {
        checkBridgeHealth();
        const isOffline = !navigator.onLine || (e.message && (e.message.includes("fetch") || e.message.includes("Failed") || e.message.includes("Network")));
        const msg = isOffline
          ? `Fast-Bridge offline on port ${port}. Please click re-sync or prompt agent to start Fast-Bridge.`
          : `Fast-Bridge Error: ${e.message}`;
        showToast(msg, "error");
      } finally {
        isUpdating = false;
        setRebuildingUI(false);
        if (pendingUpdate) executePendingUpdate();
      }
    }

    // Request viewport snapshot
    async function requestCapture(viewName) {
      const port = state.bridgePort || 54321;
      setRebuildingUI(true);
      try {
        const resp = await fetch(`http://127.0.0.1:${port}/api/capture`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ view_name: viewName })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.image_base64) {
            const previewImg = document.getElementById("viewport-preview");
            previewImg.src = data.image_base64;
            onViewportImageLoaded(previewImg);
          }
        }
      } catch (e) {}
      finally {
        setRebuildingUI(false);
      }
    }

    // Refresh dimensions from SolidWorks
    async function fetchDimensions() {
      const port = state.bridgePort || 54321;
      showToast("Fetching live dimensions...", "info");
      try {
        const resp = await fetch(`http://127.0.0.1:${port}/api/dimensions`, { method: "GET" });
        if (resp.ok) {
          const data = await resp.json();
          if (data.dimensions) {
            state.dimensions = data.dimensions;
            renderDimensions(state.dimensions);
            showToast(`Loaded ${data.dimensions.length} dimensions`, "success");
          }
        }
      } catch (e) {
        showToast("Failed to connect to Fast-Bridge", "error");
      }
    }

    function setRebuildingUI(active) {
      const spinner = document.getElementById("rebuild-spinner");
      if (spinner) spinner.style.opacity = active ? "1" : "0";
    }

    function updateBboxReadout(bbox) {
      const el = document.getElementById("bbox-text");
      if (!el) return;
      if (bbox && bbox.dx !== undefined) {
        el.innerText = `${round2(bbox.dx)} × ${round2(bbox.dy)} × ${round2(bbox.dz)} mm`;
      } else {
        el.innerText = "Bounds: active";
      }
    }

    function updateModifiedIndicators() {
      let count = 0;
      currentValues.forEach((val, name) => {
        const orig = originalValues.get(name);
        const row = document.getElementById(`dim-row-${sanitizeId(name)}`);
        const dot = document.getElementById(`mod-dot-${sanitizeId(name)}`);
        if (orig !== undefined && Math.abs(val - orig) > 0.001) {
          count++;
          if (dot) dot.classList.remove("hidden");
        } else {
          if (dot) dot.classList.add("hidden");
        }
      });
      document.getElementById("modified-count-badge").innerText = `${count} modified`;
    }

    function highlightRowError(dimName) {
      const row = document.getElementById(`dim-row-${sanitizeId(dimName)}`);
      if (row) row.classList.add("revert-error");
    }

    function clearRowError(dimName) {
      const row = document.getElementById(`dim-row-${sanitizeId(dimName)}`);
      if (row) row.classList.remove("revert-error");
    }

    function revertLocalDimension(dimName, value) {
      currentValues.set(dimName, value);
      const slider = document.getElementById(`slider-${sanitizeId(dimName)}`);
      const numInput = document.getElementById(`num-${sanitizeId(dimName)}`);
      if (slider) slider.value = value;
      if (numInput) numInput.value = value;
      updateModifiedIndicators();
    }

    function resetAllDimensions() {
      originalValues.forEach((val, name) => {
        revertLocalDimension(name, val);
        const dimObj = state.dimensions.find(d => d.full_name === name);
        const units = dimObj ? dimObj.units : "mm";
        onDimensionInput(name, val, units);
      });
      showToast("Reset all dimensions to original values", "info");
    }

    function showToast(msg, type = "info") {
      const toast = document.getElementById("status-toast");
      const msgEl = document.getElementById("toast-message");
      if (!toast || !msgEl) return;
      msgEl.innerText = msg;
      toast.style.opacity = "1";
      if (type === "success") {
        toast.className = "mt-2 text-[10px] py-1 px-2.5 rounded border border-emerald-500/30 bg-emerald-950/40 text-emerald-300 flex items-center justify-between shrink-0";
      } else if (type === "error") {
        toast.className = "mt-2 text-[10px] py-1 px-2.5 rounded border border-rose-500/30 bg-rose-950/40 text-rose-300 flex items-center justify-between shrink-0";
      } else {
        toast.className = "mt-2 text-[10px] py-1 px-2.5 rounded border border-cyan-500/30 bg-cyan-950/40 text-cyan-300 flex items-center justify-between shrink-0";
      }
      setTimeout(() => { toast.style.opacity = "0"; }, 3500);
    }

    function emitPromptToAgent() {
      const modified = [];
      currentValues.forEach((val, name) => {
        const orig = originalValues.get(name);
        if (orig !== undefined && Math.abs(val - orig) > 0.001) {
          const dimObj = state.dimensions.find(d => d.full_name === name);
          const feat = dimObj ? dimObj.owner_feature : "Feature";
          const hint = (state.dimensionLabels && state.dimensionLabels[name]) || (dimObj && dimObj.semantic_hint) || dimObj?.name || name;
          modified.push(`- ${hint} (${name}) on ${feat}: changed from ${orig} to ${val}`);
        }
      });

      if (modified.length === 0) {
        showToast("No dimensions have been modified", "info");
        return;
      }

      const promptText = `I have adjusted the SolidWorks model parameters via the interactive studio:\n${modified.join('\n')}\nPlease verify the model geometry and update any associated technical drawings or stress simulations.`;

      // Copy to clipboard
      navigator.clipboard.writeText(promptText).then(() => {
        showToast("Copied update prompt to clipboard!", "success");
      }).catch(() => {
        showToast("Prompt ready for agent", "success");
      });

      // Attempt postMessage for Generative UI
      try {
        window.parent.postMessage({
          type: "ui/message",
          content: promptText
        }, "*");
      } catch (e) {}
    }

    function sanitizeId(str) {
      return String(str || "").replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    function round2(val) {
      return Number(val || 0).toFixed(1);
    }
  </script>
</body>
</html>
