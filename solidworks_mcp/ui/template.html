<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolidWorks AI Studio</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card: #0f172a;
      --card-muted: #1e293b;
      --border: #1e293b;
      --border-subtle: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #0284c7;
      --danger: #ef4444;
      --success: #10b981;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --card-muted: #f1f5f9;
        --border: #e2e8f0;
        --border-subtle: #cbd5e1;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #0284c7;
        --primary-hover: #0369a1;
        --accent: #38bdf8;
        --danger: #dc2626;
        --success: #059669;
      }
    }
    body {
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 6px;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    .cad-grid {
      background-image: 
        radial-gradient(rgba(56, 189, 248, 0.12) 1px, transparent 1px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 20px 20px, 40px 40px, 40px 40px;
    }
    input[type=range] {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 9999px;
      background: #1e293b;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
      border: 2px solid #ffffff;
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .revert-error {
      border-color: var(--danger) !important;
      animation: pulse-red 1.2s ease-in-out infinite;
    }
    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div id="app" class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col transition-all">
    
    <!-- Top Header -->
    <header class="px-4 py-3 bg-slate-950/80 backdrop-blur-md border-b border-slate-800 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <!-- SolidWorks Emblem -->
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-500 to-red-600 text-white flex items-center justify-center font-black text-xs shadow-md shadow-rose-950/40 ring-1 ring-white/10 shrink-0">
          SW
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 id="model-title" class="text-sm font-bold text-white tracking-tight truncate max-w-[180px] sm:max-w-xs md:max-w-md">SolidWorks Part</h1>
            <span id="unit-badge" class="px-1.5 py-0.5 rounded text-[10px] font-mono font-semibold bg-slate-800 text-cyan-400 border border-slate-700 uppercase">MM</span>
          </div>
          <div class="flex items-center gap-2 text-xs text-slate-400 mt-0.5">
            <span id="connection-badge" class="inline-flex items-center gap-1.5 font-medium text-emerald-400 text-[11px]">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              <span id="connection-text">Fast-Bridge Active</span>
            </span>
            <span class="text-slate-600">•</span>
            <span id="features-summary" class="text-slate-400 text-[11px]">Parametric CAD</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="btn-refresh" title="Reload from SolidWorks" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 transition text-xs font-medium flex items-center gap-1.5 cursor-pointer shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span class="hidden sm:inline">Sync</span>
        </button>
        <button id="btn-prompt-agent" title="Send modifications to AI chat" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-sky-600 hover:from-cyan-400 hover:to-sky-500 text-white transition text-xs font-semibold flex items-center gap-1.5 shadow-md shadow-sky-950/40 cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          <span>Prompt Agent</span>
        </button>
      </div>
    </header>

    <!-- Main Workspace: Viewport (Left/Top) + Parametric Sliders (Right/Bottom) -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-0 border-b border-slate-800">
      
      <!-- 3D Viewport Stage (5 cols on md) -->
      <div class="md:col-span-5 bg-slate-950/70 p-3 flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-800">
        
        <!-- Orientation Toolbar -->
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center p-0.5 rounded-lg bg-slate-900 border border-slate-800">
            <button data-view="*Isometric" class="view-btn px-2.5 py-1 rounded text-xs font-medium transition cursor-pointer bg-cyan-600 text-white shadow-xs">Iso</button>
            <button data-view="*Front" class="view-btn px-2.5 py-1 rounded text-xs font-medium transition cursor-pointer text-slate-400 hover:text-slate-200">Front</button>
            <button data-view="*Top" class="view-btn px-2.5 py-1 rounded text-xs font-medium transition cursor-pointer text-slate-400 hover:text-slate-200">Top</button>
            <button data-view="*Right" class="view-btn px-2.5 py-1 rounded text-xs font-medium transition cursor-pointer text-slate-400 hover:text-slate-200">Right</button>
          </div>
          <span id="render-latency" class="text-[10px] font-mono text-slate-500">Live</span>
        </div>

        <!-- Viewport Render Area -->
        <div id="viewport-stage" class="relative w-full aspect-square sm:aspect-[4/3] rounded-xl overflow-hidden bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 border border-slate-800 flex items-center justify-center select-none shadow-inner my-auto">
          <!-- CAD Grid Background -->
          <div class="absolute inset-0 cad-grid opacity-25 pointer-events-none"></div>

          <!-- Placeholder Stage when image is loading / empty -->
          <div id="viewport-fallback" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center transition-opacity duration-300">
            <div class="w-14 h-14 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mb-2.5 shadow-lg shadow-cyan-500/5 animate-pulse">
              <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
            <p id="viewport-fallback-status" class="text-xs font-semibold text-slate-300 uppercase tracking-wider">SolidWorks Viewport</p>
            <p class="text-[11px] text-slate-500 mt-0.5">Capturing live 3D orientation...</p>
            <button id="btn-force-capture" class="mt-2.5 px-3 py-1 rounded-md text-[11px] font-medium bg-cyan-600/20 hover:bg-cyan-600/30 text-cyan-300 border border-cyan-500/30 transition flex items-center gap-1.5 cursor-pointer">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
              <span>Capture Viewport</span>
            </button>
          </div>

          <!-- Active Model Render -->
          <img id="viewport-preview"
               src=""
               alt=""
               style="display: none;"
               class="relative z-10 max-h-full max-w-full object-contain filter drop-shadow-[0_10px_20px_rgba(0,0,0,0.5)] transition-opacity duration-200">

          <!-- Coordinate Axes Triad (Bottom-Left) -->
          <div class="absolute bottom-2 left-2 z-20 flex items-center gap-1.5 px-2 py-0.5 rounded bg-slate-900/85 backdrop-blur-md border border-slate-800 text-[10px] font-mono shadow-sm">
            <span class="text-rose-400 font-bold">X</span>
            <span class="text-emerald-400 font-bold">Y</span>
            <span class="text-sky-400 font-bold">Z</span>
            <span class="text-slate-600">|</span>
            <span id="active-view-badge" class="text-slate-300 uppercase">ISO</span>
          </div>

          <!-- Bounding Box Floating HUD (Bottom-Right) -->
          <div id="bbox-readout" class="absolute bottom-2 right-2 z-20 px-2 py-0.5 rounded bg-slate-900/85 backdrop-blur-md border border-slate-800 text-[10px] font-mono text-slate-300 flex items-center gap-1 shadow-sm">
            <svg class="w-2.5 h-2.5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
            <span id="bbox-text">Bounds: --</span>
          </div>

          <!-- Rebuilding Progress Overlay -->
          <div id="rebuild-spinner" class="absolute inset-0 z-30 bg-slate-950/70 backdrop-blur-xs flex flex-col items-center justify-center gap-2 opacity-0 pointer-events-none transition-opacity duration-150">
            <div class="w-7 h-7 rounded-full border-2 border-cyan-400/20 border-t-cyan-400 animate-spin"></div>
            <span class="text-[11px] font-medium text-cyan-200 tracking-wider uppercase drop-shadow">Rebuilding...</span>
          </div>
        </div>

      </div>

      <!-- Parametric Sliders Panel (7 cols on md) -->
      <div class="md:col-span-7 p-4 flex flex-col justify-between max-h-[460px] overflow-y-auto bg-slate-900">
        <div>
          <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-white uppercase tracking-wider">Parametric Controls</span>
              <span id="dims-count" class="px-1.5 py-0.2 rounded text-[10px] font-mono bg-slate-800 text-slate-400 border border-slate-700">0</span>
            </div>
            <span id="modified-count-badge" class="text-[11px] font-mono text-cyan-400 font-medium">0 modified</span>
          </div>
          
          <div id="dimensions-container" class="space-y-3.5">
            <!-- Dynamically populated dimension groups -->
          </div>
        </div>

        <!-- Toast Feedback Bar -->
        <div id="status-toast" class="mt-3 text-xs py-2 px-3 rounded-lg border border-transparent flex items-center justify-between transition-all opacity-0">
          <span id="toast-message" class="truncate font-medium">Ready</span>
        </div>
      </div>

    </div>

    <!-- Quick Edit Action Bar -->
    <footer class="px-4 py-2 bg-slate-950/60 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <label class="inline-flex items-center gap-1.5 cursor-pointer">
          <input type="checkbox" id="chk-live-sync" checked class="rounded border-slate-700 text-cyan-500 focus:ring-0 w-3.5 h-3.5 bg-slate-800">
          <span class="text-[11px]">Live Rebuild on Drag</span>
        </label>
      </div>
      <div class="flex items-center gap-3">
        <button id="btn-reset-all" class="text-[11px] text-slate-400 hover:text-rose-400 transition cursor-pointer">Reset All</button>
        <span class="text-slate-700">|</span>
        <span class="font-mono text-[11px] text-slate-500">SolidWorks AI Studio</span>
      </div>
    </footer>

  </div>

  <script>
    // Injected state payload
    const state = window.__SW_STATE__ || {
      bridgePort: 54321,
      modelTitle: "SolidWorks Model",
      units: "mm",
      initialImage: "",
      bbox: null,
      dimensions: []
    };

    // Tracking modified parameters
    const originalValues = new Map();
    const currentValues = new Map();
    let isUpdating = false;
    let pendingUpdate = null;
    let debounceTimer = null;
    let activeView = "*Isometric";

    // Viewport image callbacks
    function onViewportImageLoaded(img) {
      if (img.src && !img.src.endsWith("#empty")) {
        img.style.display = "block";
        img.style.opacity = "1";
        const fallback = document.getElementById("viewport-fallback");
        if (fallback) fallback.style.opacity = "0";
      }
    }

    function onViewportImageError(img) {
      img.style.display = "none";
      const fallback = document.getElementById("viewport-fallback");
      if (fallback) {
        fallback.style.opacity = "1";
        const statusText = document.getElementById("viewport-fallback-status");
        if (statusText) statusText.innerText = "Viewport Stream Standby";
      }
    }

    // Initialize UI
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("model-title").innerText = state.modelTitle || "SolidWorks Model";
      document.getElementById("unit-badge").innerText = state.units || "mm";

      // Viewport image initialization
      const previewImg = document.getElementById("viewport-preview");
      if (state.initialImage && state.initialImage.startsWith("data:image")) {
        previewImg.src = state.initialImage;
        previewImg.onload = () => onViewportImageLoaded(previewImg);
      } else {
        // Automatically attempt to fetch viewport capture on startup
        requestCapture(activeView);
      }

      updateBboxReadout(state.bbox);

      // Populate dimensions
      renderDimensions(state.dimensions);

      // Bind view switcher
      document.querySelectorAll(".view-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".view-btn").forEach(b => {
            b.classList.remove("bg-cyan-600", "text-white", "shadow-xs");
            b.classList.add("text-slate-400");
          });
          btn.classList.add("bg-cyan-600", "text-white", "shadow-xs");
          btn.classList.remove("text-slate-400");
          activeView = btn.getAttribute("data-view");
          const viewLabel = activeView.replace("*", "").toUpperCase();
          document.getElementById("active-view-badge").innerText = viewLabel;
          requestCapture(activeView);
        });
      });

      // Bind force capture button
      const forceBtn = document.getElementById("btn-force-capture");
      if (forceBtn) {
        forceBtn.addEventListener("click", () => requestCapture(activeView));
      }

      // Bind refresh
      document.getElementById("btn-refresh").addEventListener("click", () => {
        fetchDimensions();
        requestCapture(activeView);
      });

      // Bind prompt agent
      document.getElementById("btn-prompt-agent").addEventListener("click", emitPromptToAgent);

      // Bind reset all
      document.getElementById("btn-reset-all").addEventListener("click", resetAllDimensions);

      // Test bridge connectivity
      checkBridgeHealth();
    });

    // Check Fast-Bridge health
    async function checkBridgeHealth() {
      const port = state.bridgePort || 54321;
      try {
        const resp = await fetch(`http://127.0.0.1:${port}/health`, { method: "GET" });
        if (resp.ok) {
          const data = await resp.json();
          document.getElementById("connection-badge").className = "inline-flex items-center gap-1.5 font-medium text-emerald-400 text-[11px]";
          document.getElementById("connection-text").innerText = `Fast-Bridge :${port}`;
          return;
        }
      } catch (e) {
        // Fallback to PostMessage MCP Apps mode
      }
      document.getElementById("connection-badge").className = "inline-flex items-center gap-1.5 font-medium text-sky-400 text-[11px]";
      document.getElementById("connection-text").innerText = "MCP Apps Protocol";
    }

    // Render grouped dimension sliders
    function renderDimensions(dims) {
      const container = document.getElementById("dimensions-container");
      container.innerHTML = "";

      if (!dims || dims.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-500 text-xs">
            <svg class="w-8 h-8 mx-auto mb-2 opacity-40 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
            No driving dimensions detected in active model.
          </div>
        `;
        document.getElementById("dims-count").innerText = "0";
        return;
      }

      document.getElementById("dims-count").innerText = dims.length;

      // Group by owner feature
      const groups = {};
      dims.forEach(dim => {
        const owner = dim.owner_feature || "Model Dimensions";
        if (!groups[owner]) groups[owner] = [];
        groups[owner].push(dim);
        originalValues.set(dim.full_name, dim.value);
        currentValues.set(dim.full_name, dim.value);
      });

      Object.entries(groups).forEach(([featName, featDims]) => {
        const groupEl = document.createElement("div");
        groupEl.className = "rounded-xl border border-slate-800 bg-slate-950/40 overflow-hidden";
        
        // Group Header
        const headerEl = document.createElement("div");
        headerEl.className = "px-3 py-2 bg-slate-950/80 border-b border-slate-800/80 flex items-center justify-between text-xs font-semibold text-slate-300";
        headerEl.innerHTML = `
          <div class="flex items-center gap-2">
            <svg class="w-3.5 h-3.5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>${featName}</span>
          </div>
          <span class="text-[10px] font-mono text-slate-500">${featDims.length} dim</span>
        `;
        groupEl.appendChild(headerEl);

        // Group Body
        const bodyEl = document.createElement("div");
        bodyEl.className = "p-3 space-y-3";

        featDims.forEach(dim => {
          const rowEl = document.createElement("div");
          rowEl.className = "space-y-1.5";
          rowEl.id = `dim-row-${sanitizeId(dim.full_name)}`;

          const isAngle = dim.is_angle || dim.units === "deg";
          const unitLabel = dim.units || (isAngle ? "deg" : "mm");
          const stepVal = dim.step || (isAngle ? 1.0 : 0.5);
          const minVal = dim.min !== undefined ? dim.min : (isAngle ? 1.0 : Math.max(0.1, dim.value * 0.2));
          const maxVal = dim.max !== undefined ? dim.max : (isAngle ? 180.0 : Math.max(10.0, dim.value * 2.5));

          rowEl.innerHTML = `
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center gap-1.5 min-w-0">
                <span class="font-mono text-slate-300 font-semibold truncate max-w-[140px] sm:max-w-[180px]">${dim.name || dim.full_name}</span>
                <span id="mod-dot-${sanitizeId(dim.full_name)}" class="w-1.5 h-1.5 rounded-full bg-cyan-400 hidden"></span>
              </div>
              <div class="flex items-center gap-1">
                <input type="number" 
                       id="num-${sanitizeId(dim.full_name)}" 
                       value="${dim.value}" 
                       step="${stepVal}" 
                       min="${minVal}" 
                       max="${maxVal}" 
                       class="w-16 px-1.5 py-0.5 text-right font-mono text-xs bg-slate-800 border border-slate-700 rounded text-cyan-300 focus:outline-none focus:border-cyan-400">
                <span class="text-[11px] font-mono text-slate-400">${unitLabel}</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button title="Decrease" class="step-btn px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-[11px] font-mono border border-slate-700" data-delta="-${stepVal * 5}">-</button>
              <input type="range" 
                     id="slider-${sanitizeId(dim.full_name)}" 
                     value="${dim.value}" 
                     min="${minVal}" 
                     max="${maxVal}" 
                     step="${stepVal}" 
                     class="flex-1 accent-cyan-400 cursor-pointer">
              <button title="Increase" class="step-btn px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white text-[11px] font-mono border border-slate-700" data-delta="+${stepVal * 5}">+</button>
            </div>
          `;

          // Event Listeners
          const slider = rowEl.querySelector(`#slider-${sanitizeId(dim.full_name)}`);
          const numInput = rowEl.querySelector(`#num-${sanitizeId(dim.full_name)}`);

          slider.addEventListener("input", (e) => {
            const val = parseFloat(e.target.value);
            numInput.value = val;
            onDimensionInput(dim.full_name, val, unitLabel);
          });

          numInput.addEventListener("change", (e) => {
            const val = parseFloat(e.target.value);
            if (!isNaN(val)) {
              slider.value = val;
              onDimensionInput(dim.full_name, val, unitLabel);
            }
          });

          rowEl.querySelectorAll(".step-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              const delta = parseFloat(btn.getAttribute("data-delta"));
              const cur = parseFloat(slider.value);
              const next = Math.max(minVal, Math.min(maxVal, parseFloat((cur + delta).toFixed(2))));
              slider.value = next;
              numInput.value = next;
              onDimensionInput(dim.full_name, next, unitLabel);
            });
          });

          bodyEl.appendChild(rowEl);
        });

        groupEl.appendChild(bodyEl);
        container.appendChild(groupEl);
      });
    }

    // Debounced dimension change handler
    function onDimensionInput(dimName, value, units) {
      currentValues.set(dimName, value);
      updateModifiedIndicators();

      const liveSync = document.getElementById("chk-live-sync").checked;
      if (!liveSync) return;

      pendingUpdate = { name: dimName, value: value, units: units, view_name: activeView };

      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        executePendingUpdate();
      }, 60);
    }

    // Execute single-flight update over Fast-Bridge
    async function executePendingUpdate() {
      if (isUpdating || !pendingUpdate) return;

      const update = pendingUpdate;
      pendingUpdate = null;
      isUpdating = true;

      setRebuildingState(true);

      const port = state.bridgePort || 54321;
      const url = `http://127.0.0.1:${port}/api/set_dimension`;

      try {
        const resp = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(update)
        });

        const data = await resp.json();

        if (data.success) {
          showToast(`Rebuilt: ${update.name} → ${update.value} ${update.units}`, "success");
          if (data.image_base64) {
            updateViewportImage(data.image_base64);
          }
          if (data.bbox) {
            updateBboxReadout(data.bbox);
          }
        } else {
          // Rebuild error with automatic rollback
          showToast(`Rebuild error: ${data.error || 'Failed'}. Reverted.`, "danger");
          const revertVal = data.revert_value !== undefined ? data.revert_value : originalValues.get(update.name);
          if (revertVal !== undefined) {
            syncInputElements(update.name, revertVal);
            currentValues.set(update.name, revertVal);
            updateModifiedIndicators();
            flashErrorState(update.name);
          }
        }
      } catch (e) {
        // Fallback: PostMessage MCP Apps protocol
        tryPostMessageSetDimension(update);
      } finally {
        setRebuildingState(false);
        isUpdating = false;

        if (pendingUpdate) {
          executePendingUpdate();
        }
      }
    }

    // MCP Apps PostMessage fallback
    function tryPostMessageSetDimension(update) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          jsonrpc: "2.0",
          method: "tools/call",
          params: {
            name: "set_dimension",
            arguments: {
              name: update.name,
              value: update.value,
              units: update.units
            }
          },
          id: Date.now()
        }, "*");
      }
    }

    // Request viewport image for view
    async function requestCapture(viewName) {
      setRebuildingState(true);
      const port = state.bridgePort || 54321;
      try {
        const resp = await fetch(`http://127.0.0.1:${port}/api/capture`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ view_name: viewName })
        });
        if (resp.ok) {
          const data = await resp.json();
          if (data.success && data.image_base64) {
            updateViewportImage(data.image_base64);
            if (data.bbox) updateBboxReadout(data.bbox);
          }
        }
      } catch (e) {
        console.warn("Capture fetch failed:", e);
      } finally {
        setRebuildingState(false);
      }
    }

    // Update viewport preview image safely
    function updateViewportImage(base64Data) {
      const img = document.getElementById("viewport-preview");
      if (!img) return;
      img.src = base64Data;
      img.onload = () => onViewportImageLoaded(img);
    }

    // Update Bounding Box HUD
    function updateBboxReadout(bbox) {
      const el = document.getElementById("bbox-text");
      if (!el) return;
      if (!bbox) {
        el.innerText = "Bounds: Active";
        return;
      }
      const dx = bbox.dx !== undefined ? bbox.dx : (bbox.width || "--");
      const dy = bbox.dy !== undefined ? bbox.dy : (bbox.height || "--");
      const dz = bbox.dz !== undefined ? bbox.dz : (bbox.depth || "--");
      el.innerText = `${dx} × ${dy} × ${dz} mm`;
    }

    // Refresh dimensions list from server
    async function fetchDimensions() {
      const port = state.bridgePort || 54321;
      try {
        const resp = await fetch(`http://127.0.0.1:${port}/api/dimensions`);
        if (resp.ok) {
          const data = await resp.json();
          if (data.dimensions) {
            renderDimensions(data.dimensions);
            showToast("Dimensions synchronized with SolidWorks", "success");
          }
        }
      } catch (e) {
        showToast("Sync failed: Fast-Bridge offline", "danger");
      }
    }

    // Reset all parameters to initial values
    function resetAllDimensions() {
      originalValues.forEach((origVal, dimName) => {
        syncInputElements(dimName, origVal);
        onDimensionInput(dimName, origVal, state.units);
      });
      showToast("Reset all dimensions to initial values", "info");
    }

    function syncInputElements(dimName, val) {
      const s = document.getElementById(`slider-${sanitizeId(dimName)}`);
      const n = document.getElementById(`num-${sanitizeId(dimName)}`);
      if (s) s.value = val;
      if (n) n.value = val;
    }

    function updateModifiedIndicators() {
      let modCount = 0;
      currentValues.forEach((val, name) => {
        const orig = originalValues.get(name);
        const dot = document.getElementById(`mod-dot-${sanitizeId(name)}`);
        if (Math.abs(val - orig) > 1e-4) {
          modCount++;
          if (dot) dot.classList.remove("hidden");
        } else {
          if (dot) dot.classList.add("hidden");
        }
      });
      const badge = document.getElementById("modified-count-badge");
      if (badge) badge.innerText = `${modCount} modified`;
    }

    function flashErrorState(dimName) {
      const row = document.getElementById(`dim-row-${sanitizeId(dimName)}`);
      if (!row) return;
      row.classList.add("revert-error");
      setTimeout(() => row.classList.remove("revert-error"), 1500);
    }

    function setRebuildingState(active) {
      const sp = document.getElementById("rebuild-spinner");
      if (sp) sp.style.opacity = active ? "1" : "0";
    }

    function showToast(msg, type = "info") {
      const toast = document.getElementById("status-toast");
      const msgEl = document.getElementById("toast-message");
      if (!toast || !msgEl) return;
      msgEl.innerText = msg;
      
      toast.className = "mt-3 text-xs py-2 px-3 rounded-lg border flex items-center justify-between transition-all opacity-100 ";
      if (type === "success") {
        toast.className += "bg-emerald-950/60 border-emerald-800 text-emerald-300";
      } else if (type === "danger") {
        toast.className += "bg-rose-950/60 border-rose-800 text-rose-300";
      } else {
        toast.className += "bg-slate-800/80 border-slate-700 text-slate-300";
      }

      setTimeout(() => {
        toast.classList.add("opacity-0");
      }, 3500);
    }

    function emitPromptToAgent() {
      const mods = [];
      currentValues.forEach((val, name) => {
        const orig = originalValues.get(name);
        if (Math.abs(val - orig) > 1e-4) {
          mods.push(`- \`${name}\`: changed from ${orig} to ${val}`);
        }
      });

      const promptText = mods.length > 0
        ? `I adjusted the following parametric dimensions in SolidWorks Interactive Studio:\n${mods.join('\n')}\n\nPlease inspect the modified geometry with verify_model, verify DFM constraints, and proceed with the design.`
        : `I inspected the SolidWorks model in Interactive Studio without changing dimensions. Please continue with the design.`;

      // 1. PostMessage ui/message
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          jsonrpc: "2.0",
          method: "ui/message",
          params: { content: promptText }
        }, "*");
      }

      // 2. Fallback: Copy to clipboard
      if (navigator.clipboard) {
        navigator.clipboard.writeText(promptText).then(() => {
          showToast("Prompt copied to clipboard! Paste into chat.", "success");
        }).catch(() => {
          showToast("Copied parameters to prompt queue.", "info");
        });
      } else {
        showToast("Parameters prepared for agent.", "info");
      }
    }

    function sanitizeId(str) {
      return str.replace(/[^a-zA-Z0-9_-]/g, "_");
    }
  </script>
</body>
</html>
